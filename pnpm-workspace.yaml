allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

# 7 days: a compromised release is normally yanked within hours (https://pnpm.io/supply-chain-security)
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true

# GHSA-g89c-p67h-r497 (libheif), transitive via miniflare
overrides:
  sharp: ">=0.35.4"
